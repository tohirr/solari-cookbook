# passk tests itself. The unit tests cover the harness on in-memory desktops;
# the two benches run the real pipeline on the scripted provider (no Solari
# key, no model key): one that must clear the gate and one that must be
# refused by it. The second job runs the same two benches through the
# GitHub Action, so the action is proven here before anyone else uses it.
name: passk
on:
  push:
    branches: [main, passk]
    paths: [passk/**, .github/workflows/passk.yml]
  pull_request:
    paths: [passk/**, .github/workflows/passk.yml]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passk
    env:
      PASSK_PROVIDER: scripted
      PASSK_CLASSIFY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: passk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: a 10/10 agent clears --require-lower 0.7 (the bound 10/10 can prove is 72%)
        run: npm run passk run tasks/fake.yaml -- --k 10 --concurrency 4 --require-lower 0.7
      - name: an 8/10 agent is refused by --require 0.9 (exit 2)
        env:
          PASSK_SCRIPT: "pass*6,fail,pass,claim_only,pass"
        run: |
          set +e
          npm run passk run tasks/fake.yaml -- --k 10 --concurrency 4 --require 0.9
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2 from the gate, got $code"; exit 1; }
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: a 10/10 agent clears --require-lower 0.7 through the action
        id: pass
        uses: ./passk
        with:
          task: passk/tasks/fake.yaml
          provider: scripted
          k: 10
          concurrency: 4
          require-lower: 0.7
          artifact-name: passk-action-pass
      - name: outputs are set
        run: |
          test "${{ steps.pass.outputs.passed }}" = "10"
          test "${{ steps.pass.outputs.n }}" = "10"
          test "${{ steps.pass.outputs.exit-code }}" = "0"
      - name: an 8/10 agent is refused by --require 0.9 through the action
        id: miss
        uses: ./passk
        continue-on-error: true
        env:
          PASSK_SCRIPT: "pass*6,fail,pass,claim_only,pass"
        with:
          task: passk/tasks/fake.yaml
          provider: scripted
          k: 10
          concurrency: 4
          require: 0.9
          artifact-name: passk-action-miss
      - name: the refusal is exit 2 and the step failed
        run: |
          test "${{ steps.miss.outcome }}" = "failure"
          test "${{ steps.miss.outputs.exit-code }}" = "2"
          test "${{ steps.miss.outputs.passed }}" = "8"
      - name: a custom agent from the workspace runs through the action
        id: custom
        uses: ./passk
        env:
          PASSK_FAKE: "1"
        with:
          task: passk/tasks/fake.yaml
          agent: passk/test/fixtures/custom-agent.ts
          k: 5
          concurrency: 5
          require: 1
          artifact-name: passk-action-custom
      - name: the custom agent was the agent
        run: |
          test "${{ steps.custom.outputs.passed }}" = "5"
          test "${{ steps.custom.outputs.exit-code }}" = "0"
          grep -q '"agent": "custom: ' "${{ steps.custom.outputs.bench-dir }}/bench.json"
