# yaml-language-server: $schema=../schema/task.schema.json
# bookmarx (bookmarx.space) is a search over saved posts, built to answer a
# fuzzy memory with the post you meant. This runs the product *inside* the
# desktop: the real UI as static files and its retrieval reimplemented in a
# stdlib Python server over a 269-post slice of the demo library, so every
# fork starts from the same bytes and no live database is touched. See
# tasks/bookmarx-lite/README.md.
# This memory is a fifteen-word paraphrase with none of the post's words; it ranks first in the box (second on the live site).
# A card click records the click (the app's own relevance signal) in
# state.json inside the VM, which is what the check reads.
id: bookmarx-box-paraphrase
name: Find a saved post from a long paraphrase, in the box
template: default
resolution: 1280x720
# Setup is shared, because it was proven once: the app in a box, then the
# template's Chrome relaunched on it with a DevTools port.
setup_from:
  - bookmarx-lite/box.yaml
  - file: bookmarx-lite/chrome.yaml
    with: { url: "http://127.0.0.1:8080/box" }
prompt: >
  bookmarx is open in the browser: a search over my saved posts. Find the post
  I mean: "some guy that said his mother understood him after he made her watch a scene with him". Search for it, pick the result that matches, and open the
  post itself on X (clicking a card opens it in a new tab). Leave that tab
  open when you are done.
golden:
  - exec: sh
    args: ["-c", "curl -s -X POST -H 'content-type: application/json' -d '{\"clicked\":{\"query\":\"some guy that said his mother understood him after he made her watch a scene with him\",\"bookmarkId\":\"1844415570311250246\"}}' http://127.0.0.1:8080/api/search"]
checks:
  - name: the post 1844415570311250246 was opened from the results
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "clicked", "1844415570311250246"]
    stdout_contains: "PASS"
max_steps: 40
# What the app recorded, kept per run: which query was searched and which
# card was clicked, not just whether the right one was.
evidence:
  - /root/app/state.json
