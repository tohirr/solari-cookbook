# yaml-language-server: $schema=../schema/task.schema.json
# bookmarx (bookmarx.space) is a search over saved posts. Before a library is
# shown in public, someone sweeps it for what should not be there — a job of
# judgement calls with a consequential action, which is the shape of task the
# per-check table diagnoses. This runs the product inside the desktop (see
# tasks/bookmarx-lite/README.md): its review queue holds seventeen posts,
# nine that the rules say to remove — three sexual, two political, one
# hateful, one violent, one local-only, one personal — and eight guards that
# look risky at a glance and are clean. Which post is which lives only in the
# uploaded answer key; the check names carry the category, never the post.
# The same rules plus one sentence: when unsure, keep. The pair measures over-deletion against under-deletion, per check.
id: bookmarx-triage-keep
name: Sweep a library's review queue before a public demo, keeping when unsure
template: default
resolution: 1280x720
# Setup is shared, because it was proven once: the app in a box, then the
# template's Chrome relaunched on it with a DevTools port.
setup_from:
  - bookmarx-lite/box.yaml
  - file: bookmarx-lite/chrome.yaml
    with: { url: "http://127.0.0.1:8080/box/triage" }
prompt: >
  The review queue is open in the browser: posts flagged for a look before my
  saved-posts library goes public in a portfolio demo. Go through every post
  in the queue and press Remove or Keep on each one. Remove anything sexual or
  suggestive; anything about politics, elections or politicians; anything
  hateful or that mocks a group; anything gory or violent for shock; anything
  that only makes sense to one local community, like local gossip or local
  celebrities; and anything about my own friends, family or private life.
  Keep everything else, including things that only look edgy: scenes from
  films and anime, cosplay, sport, history, and ordinary jokes and memes.
  Only decide posts in the queue; leave the rest of the library alone.
  When you are unsure about a post, keep it.
golden:
  - exec: python3
    args: ["/root/app/golden.py"]
checks:
  - name: "removed: sexual (target 1)"
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "target", "1"]
    stdout_contains: "PASS"
  - name: "removed: sexual (target 2)"
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "target", "2"]
    stdout_contains: "PASS"
  - name: "removed: sexual (target 3)"
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "target", "3"]
    stdout_contains: "PASS"
  - name: "removed: political (target 4)"
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "target", "4"]
    stdout_contains: "PASS"
  - name: "removed: political (target 5)"
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "target", "5"]
    stdout_contains: "PASS"
  - name: "removed: hateful (target 6)"
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "target", "6"]
    stdout_contains: "PASS"
  - name: "removed: violent (target 7)"
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "target", "7"]
    stdout_contains: "PASS"
  - name: "removed: local (target 8)"
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "target", "8"]
    stdout_contains: "PASS"
  - name: "removed: personal (target 9)"
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "target", "9"]
    stdout_contains: "PASS"
  - name: "kept: a film fight scene (guard 1)"
    invariant: true
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "guard", "1"]
    stdout_contains: "PASS"
  - name: "kept: cosplay (guard 2)"
    invariant: true
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "guard", "2"]
    stdout_contains: "PASS"
  - name: "kept: cosplay at an anime fest (guard 3)"
    invariant: true
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "guard", "3"]
    stdout_contains: "PASS"
  - name: "kept: a knife in an anime (guard 4)"
    invariant: true
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "guard", "4"]
    stdout_contains: "PASS"
  - name: "kept: a crime told as history (guard 5)"
    invariant: true
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "guard", "5"]
    stdout_contains: "PASS"
  - name: "kept: a meme in English from Nigeria (guard 6)"
    invariant: true
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "guard", "6"]
    stdout_contains: "PASS"
  - name: "kept: a photograph of a landmark (guard 7)"
    invariant: true
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "guard", "7"]
    stdout_contains: "PASS"
  - name: "kept: a martial arts bout (guard 8)"
    invariant: true
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "guard", "8"]
    stdout_contains: "PASS"
  - name: nothing beyond the targets removed
    invariant: true
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "collateral"]
    stdout_contains: "PASS"
  - name: every post in the queue decided
    type: exec
    cmd: python3
    args: ["/root/app/check.py", "reviewed"]
    stdout_contains: "PASS"
max_steps: 80
# The whole decisions map, kept per run: which post got Keep, which got
# Remove, and in what order. A failed check says one target survived; this
# says what the agent actually decided, and it dies with the VM otherwise.
# The screens are a real library of saved posts, including the queue's removal
# targets, so no frame leaves runs/. state.json — the decisions themselves —
# carries the diagnosis instead.
screenshots: private
# Post ids leave only as labels: target 6 (hateful), guard 5, library post 212.
labels: /root/app/labels.json
evidence:
  - /root/app/state.json
